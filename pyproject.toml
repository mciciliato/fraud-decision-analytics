[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "fraud-analytics"
version = "0.2.0"
description = "Incentive-exploitation cohort validation and cost of delayed detection, on synthetic data."
requires-python = ">=3.11"
license = "MIT"
dependencies = ["numpy>=1.26", "pandas>=2.1", "scipy>=1.15"]

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]
notebook = ["matplotlib>=3.8", "jupyter", "nbclient>=0.10", "ipykernel"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]

[tool.ruff]
line-length = 120
extend-exclude = [".claude"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
